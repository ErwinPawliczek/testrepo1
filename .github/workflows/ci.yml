name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plan:
    name: PLAN.md and workstream id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PLAN.md exists
        run: |
          if [ ! -f PLAN.md ]; then
            echo "PLAN.md is missing. It is the shared plan and must stay in the repo."
            exit 1
          fi
          echo "PLAN.md present"

      - name: PR body links an issue, or is an orchestrator PR
        if: github.event_name == 'pull_request'
        run: |
          python3 - << 'PY'
          import json, os, re, sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          pr = event.get("pull_request") or {}
          body = pr.get("body") or ""
          title = (pr.get("title") or "").lstrip()
          author = ((pr.get("user") or {}).get("login")) or ""

          closes = re.search(r"(?i)\bCloses\s+#\d+\b", body)
          # Temporary fallback so open PRs #1 and #2 (WS-2 / WS-3, no Closes #) still pass.
          # Remove this once those pull requests have merged.
          workstream = re.search(r"\bWS-\d+\b", body)
          orchestrator = author == "ErwinPawliczek" and (
              title.startswith("orchestrator:") or re.search(r"\bORCH\b", body)
          )

          if closes:
              print(f"Issue reference found: {closes.group(0)}")
          elif orchestrator:
              print("Orchestrator pull request accepted for ErwinPawliczek.")
          elif workstream:
              print(
                  f"Workstream ID found: {workstream.group(0)} "
                  "(fallback until open workstream pull requests #1 and #2 merge)."
              )
          else:
              print(
                  'PR body must contain "Closes #N". '
                  "ORCH is accepted only for ErwinPawliczek. "
                  "A Workstream ID (WS-1, WS-2, WS-3) is still accepted until pull requests #1 and #2 merge."
              )
              sys.exit(1)
          PY

      - name: Only an orchestrator PR edits PLAN.md
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - << 'PY'
          import json, os, re, subprocess, sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          pr = event.get("pull_request") or {}
          body = pr.get("body") or ""
          title = (pr.get("title") or "").lstrip()
          author = ((pr.get("user") or {}).get("login")) or ""
          orchestrator = author == "ErwinPawliczek" and (
              title.startswith("orchestrator:") or re.search(r"\bORCH\b", body)
          )
          if orchestrator:
              print(
                  "Orchestrator pull request (ErwinPawliczek, title orchestrator: or body ORCH); "
                  "PLAN.md edits are allowed."
              )
              sys.exit(0)

          diff = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  os.environ["BASE_SHA"],
                  os.environ["HEAD_SHA"],
              ],
              text=True,
          )
          changed = {line.strip() for line in diff.splitlines() if line.strip()}
          if "PLAN.md" in changed:
              print(
                  "PLAN.md edits are allowed only when the author is ErwinPawliczek and the "
                  'pull request title starts with "orchestrator:" or the body contains ORCH.'
              )
              sys.exit(1)
          print("PLAN.md unchanged.")
          PY

  lint-test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: placeholder lint and test
        run: |
          echo "No project lint or tests yet. This step is a no-op until application code exists."
