<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Dashboard (test)</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #d8dde2;
      --accent: #0b6e4f;
      --ok: #0b6e4f;
      --fail: #a32020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --card: #1d2125;
        --text: #e8eaed;
        --muted: #9aa4ae;
        --border: #30363d;
        --accent: #2ea37a;
        --ok: #2ea37a;
        --fail: #e06c6c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 1.35rem; }
    p.sub { margin: 0 0 24px; color: var(--muted); font-size: 0.9rem; }
    button {
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.6; cursor: progress; }
    #result {
      margin-top: 20px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      min-height: 1.5em;
    }
    #result[data-state="idle"] { color: var(--muted); }
    #result[data-state="ok"] { color: var(--ok); font-weight: 600; }
    #result[data-state="fail"] { color: var(--fail); font-weight: 600; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Team Dashboard (test)</h1>
    <p class="sub">WS-1 smoke test. Calls <code>GET http://localhost:8000/health</code>.</p>

    <button id="check" type="button">Check API</button>

    <div id="result" data-state="idle" role="status" aria-live="polite">
      No check run yet.
    </div>
  </main>

  <script>
    const HEALTH_URL = "http://localhost:8000/health";
    const button = document.getElementById("check");
    const result = document.getElementById("result");

    function show(state, message) {
      result.dataset.state = state;
      result.textContent = message;
    }

    async function checkApi() {
      button.disabled = true;
      show("idle", "Checking\u2026");

      try {
        const response = await fetch(HEALTH_URL, {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const body = await response.json();

        if (!body || typeof body.status !== "string") {
          throw new Error("response had no status field");
        }

        show("ok", "status: " + body.status);
      } catch (error) {
        console.error("Health check failed:", error);
        show("fail", "API offline");
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", checkApi);
  </script>
</body>
</html>
